name: Update Content

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Telegram updates and commit
        env:
          TELEGRAM_TOKEN: ${{ secrets.TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/getUpdates" | jq '.result[] | select(.message.chat.id == -1002130983218)' > updates.json
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add updates.json
          git commit -m "Update content from Telegram" || exit 0
          git push
